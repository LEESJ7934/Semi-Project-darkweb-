services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: darkweb-elasticsearch
    restart: unless-stopped

    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "${ES_JAVA_OPTS:--Xms1g -Xmx1g}"

    ports:
      - "127.0.0.1:9200:9200"

    volumes:
      - esdata:/usr/share/elasticsearch/data

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    container_name: darkweb-kibana
    restart: unless-stopped

    depends_on:
      - elasticsearch

    environment:
      ELASTICSEARCH_HOSTS: "http://elasticsearch:9200"

    ports:
      - "127.0.0.1:5601:5601"

  monstache:
    image: rwynn/monstache:6.7.7
    container_name: darkweb-monstache
    restart: unless-stopped

    depends_on:
      - elasticsearch

    volumes:
      - ./monstache/monstache.config.toml:/config/monstache.config.toml:ro

    environment:
      MONSTACHE_MONGO_URL: "${DB_URI:?DB_URI must be set in .env}"
      MONSTACHE_ES_URLS: "http://elasticsearch:9200"

    command:
      - "-f"
      - "/config/monstache.config.toml"

volumes:
  esdata: