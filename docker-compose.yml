version: "3.8"

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    restart: unless-stopped

  mongodb:
    image: mongo:6.0
    container_name: mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=adminUser
      - MONGO_INITDB_ROOT_PASSWORD=root
    volumes:
      - ./mongo-data:/data/db
      - ./mongo-keyfile:/data/keyfile
      - ./init-repl.js:/docker-entrypoint-initdb.d/init-repl.js
    entrypoint: >
      /bin/bash -c "
      chmod 600 /data/keyfile &&
      chown mongodb:mongodb /data/keyfile &&
      exec docker-entrypoint.sh mongod --replSet rs0 --auth --keyFile /data/keyfile --bind_ip_all
      "

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    container_name: kibana
    depends_on:
      - elasticsearch
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    restart: unless-stopped

  monstache:
    image: rwynn/monstache:6.7.7
    container_name: monstache
    depends_on:
      - elasticsearch
      - mongodb
    volumes:
      - ./monstache/monstache.config.toml:/config/monstache.config.toml:ro
    environment:
      - DB_URI=REMOVED_MONGODB_URI
      - ELASTICSEARCH_URL=http://elasticsearch:9200
    command: ["-f", "/config/monstache.config.toml"]
    restart: unless-stopped

volumes:
  esdata: {}