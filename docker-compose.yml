version: "3.9"

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - esdata:/usr/share/elasticsearch/data
      - /var/lib/mongo-data:/data/db
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    container_name: kibana
    depends_on:
      - elasticsearch
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    restart: unless-stopped

  monstache:
    image: rwynn/monstache:6.7.7
    container_name: monstache
    depends_on:
      - elasticsearch
    volumes:
      - ./monstache/monstache.config.toml:/config/monstache.config.toml:ro
    environment:
      - DB_URI=mongodb+srv://semi:semi@semi-darkweb.a4byixm.mongodb.net/?appName=semi-darkweb
      - ELASTICSEARCH_URL=http://elasticsearch:9200
    command: ["-f", "/config/monstache.config.toml"]
    restart: unless-stopped

volumes:
  esdata: {}