# MongoDB URL is supplied through MONSTACHE_MONGO_URL.
# Never store credentials in this file.

# Elasticsearch
elasticsearch-urls = ["http://elasticsearch:9200"]

# Synchronization options
resume = true
resume-write-unsafe = true
exit-after-direct-reads = false
enable-http-server = true
http-server-addr = ":8080"
dropped-collections = true
dropped-databases = true

# MongoDB collection to synchronize
namespace-regex = '^darkweb\.leaked_data$'
direct-read-namespaces = ["darkweb.leaked_data"]

# MongoDB collection to Elasticsearch index mapping
[[mapping]]
namespace = "darkweb.leaked_data"
index = "leaked_data"